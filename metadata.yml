title: "Sensitivity of tree species demography to climate and competition across their range"
running_title: "Tree sensitivity to climate and competition"
abstract: "Theory predicts that demographic performance should peak at the core of species ranges and decrease toward their limits. Yet, empirical correlations between population growth rate and species distribution remain weak for most tree species. Part of the problem may arise from the difficulty of integrating multiple demographic processes across the complex life cycle of a forest, and from the significant variability among individuals and locations. It remains unclear if the mismatch between performance and distribution arises from modelling limitations or if climate is simply a poor predictor of species performance across distributions. Here, we developed an Integral Projection Model to quantify how climate and competition jointly shape population growth rate for 31 tree species across eastern North America. By using flexible nonlinear hierarchical models, we addressed key gaps in previous studies while explicitly accounting for process uncertainty. Perturbation analyses revealed that population growth rate was consistently more sensitive to mean annual temperature than to conspecific or heterospecific competition across all species. We further examined how sensitivities to climate and competition varied across species ranges. The dominance of climate over competition increased toward both cold and hot range limits, while sensitivity to competition generally declined from cold to hot limits. Notably, these patterns emerged relative to the continental thermal gradient shared across species, indicating that center–limit dynamics operate at the community level rather than within individual species ranges. Across species, the largest source of variability remained the local plot conditions captured by random effects, likely reflecting differences in soil conditions, drainage, and disturbance history. Together, these results provide a mechanistic basis for understanding how forest populations and communities may reorganize in response to ongoing climate change and shifting disturbance regimes."
