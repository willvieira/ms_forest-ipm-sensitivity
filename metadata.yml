# metadata associated with thesis template
chapter-number: 2
chapter-title: "La sensibilité du taux de croissance des espèces d'arbres au climat et la compétition dans l'ensemble de leur aire de répartition"
resume-contribution: |
  Les modèles d'aire de répartition basés sur les taux démographiques sont conçus pour utiliser la variabilité individuelle afin de prédire le taux de croissance de la population. Ces modèles offrent une approche plus mécaniste pour évaluer la distribution des espèces que les modèles phénoménologiques. Malgré le grand nombre de modèles forestiers adoptant cette approche pour explorer l'influence du climat et de la compétition sur le taux de croissance de la population des espèces arboricoles, la corrélation entre la performance des espèces et leur distribution est souvent faible. Il reste à comprendre si cette faible corrélation entre la performance des espèces et leurs distributions découle des limitations des modèles utilisés ou si le climat et la compétition sont de mauvais prédicteurs pour la distribution des espèces.

  Dans ce chapitre, nous avons développé un Modèle de Projection Intégrale pour évaluer l'impact du climat et de la compétition sur chacun des composants démographiques de 31 espèces d'arbres de l'est de l'Amérique du Nord. En utilisant des modèles hiérarchiques non linéaires qui tiennent compte de l'incertitude des processus, nous avons comblé la plupart des lacunes des études précédentes.

  En utilisant des analyses de perturbation, nous avons constaté que taux de croissance de la population était plus sensible à la température annuelle moyenne qu'à la compétition conspécifique et hétérospécifique parmis toutes les espèces. Nous avons aussi examiné comment cette sensibilité variait à travers la répartition des espèces. L'effet dominant du climat par rapport à celui de la compétition augmentait lorsque les espèces approchaient des régions aux températures froides ou chaudes. De plus, la plupart des espèces présentaient un déclin de la sensibilité de taux de croissance de la population à la compétition en allant des régions aux températures froides vers les régions aux tempratures chaudes. Cependant, la variable la plus influente restait les conditions locales du site, capturées par les effets aléatoires. Ces résultats fournissent des informations importantes sur la manière dont les espèces peuvent répondre aux conditions associées aux changements climatiques et aux perturbations.

  Cette étude a été conçu par Dominique Gravel et moi-même. Le modèle a été développé par Andrew MacDonald et moi-même. Les analyses, les figures et la première version du manuscrit ont été réalisées par moi-même. Tous les co-auteurs ont contribué à la révision de ce manuscrit.
